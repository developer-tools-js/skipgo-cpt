<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkipGo Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18222d; --muted:#5b6876; --line:#d3dae1;
  --brand:#f0b400; --brand-ink:#1d1a05;
  --yard:#1f7a4d; --yard-bg:#e2f3ea;
  --out:#1d5fa8; --out-bg:#e1ecf8;
  --late:#b3261e; --late-bg:#fbe5e3;
  --off:#6b7280; --off-bg:#e6e8eb;
  --sla:#2f6b1f; --sla-bg:#d9efc9;
  --cdel:#f6a5a5; --ccol:#8ee3b2; --head-bg:#fff1a6; --cell-ink:#18222d; --past-bg:#d6e4f5;
  --pin-out:#1d5fa8; --pin-late:#b3261e; --pin-yard:#1f7a4d; --pin-ink:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12171d; --panel:#1b222b; --ink:#e8edf2; --muted:#9aa7b4; --line:#313b47;
  --yard:#5fd39a; --yard-bg:#16352a; --out:#7fb6f2; --out-bg:#162c45;
  --late:#ff8a80; --late-bg:#45201d; --off:#a3abb5; --off-bg:#2a313a;
  --sla:#a6e08a; --sla-bg:#21381a; --cdel:#7a2f2f; --ccol:#1f6a43; --head-bg:#4a4115; --cell-ink:#f2f4f6; --past-bg:#1d2b3e; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.5rem;font-weight:600}
h3{font-size:1.15rem;font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px;border-bottom:2px solid var(--ink)}
.logo{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;display:flex;align-items:center;gap:8px}
.logo b{background:var(--brand);color:var(--brand-ink);padding:2px 8px;border-radius:3px}
.demo{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px dashed var(--muted);padding:2px 8px;border-radius:99px}
.who{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.big{width:100%;padding:14px;font-size:1.05rem}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.danger{color:var(--late);border-color:var(--late)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.stat .n{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat .s{font-size:.82rem;color:var(--muted)}
.stat.yard .n{color:var(--yard)} .stat.out .n{color:var(--out)} .stat.late .n{color:var(--late)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.bin{border:2px solid transparent;border-radius:4px 4px 12px 12px;padding:6px 4px 8px;text-align:center;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:1px}
.bin .no{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.bin .st{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bin .ar{font-size:.76rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bin.dim{opacity:.22}
.bin.yard{background:var(--yard-bg);color:var(--yard);border-color:var(--yard)}
.bin.out{background:var(--out-bg);color:var(--out)}
.bin.late{background:var(--late-bg);color:var(--late);border-color:var(--late);border-style:dashed}
.bin.off{background:var(--off-bg);color:var(--off)}
.bin:hover{filter:brightness(.96)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.yard{background:var(--yard-bg);color:var(--yard)} .pill.out{background:var(--out-bg);color:var(--out)}
.pill.late{background:var(--late-bg);color:var(--late)} .pill.off{background:var(--off-bg);color:var(--off)}
.pill.sla{background:var(--sla-bg);color:var(--sla);border:1px solid var(--sla)}
.pill.brand{background:var(--brand);color:var(--brand-ink)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num{font-family:var(--display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
td select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
table.clients td.w{white-space:normal;min-width:140px;max-width:260px;overflow-wrap:anywhere}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wide{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field select,.field input,.field textarea{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.field textarea{min-height:64px;resize:vertical}
.grow{flex:1 1 150px}
.move h3{display:flex;align-items:center;gap:8px}
.move.drop{border-top:4px solid var(--out)} .move.pick{border-top:4px solid var(--yard)} .move.book{border-top:4px solid var(--brand)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.note{font-size:.85rem;color:var(--muted);max-width:70ch;margin:0}
.found{display:flex;flex-direction:column;gap:6px}
.found button{text-align:left;white-space:normal}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;max-width:calc(100% - 32px);z-index:2000}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:18px;width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,15,20,.55)}
.bigno{font-family:var(--display);font-weight:700;font-size:3rem;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-block:1px solid var(--line);padding-block:12px}
.money>div{min-width:0}
.money .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.money .s{font-size:.82rem;color:var(--muted)}
.amt{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.r{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
.login{max-width:400px;margin:40px auto 0;width:100%}
.accts{display:flex;flex-direction:column;gap:6px}
.accts button{text-align:left}
.linkbtn{border:0;background:none;color:var(--out);text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}
.daybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.daybar h2{margin-right:auto}
.daybar input{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.sched{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.runcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.runcol>h3{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px}
.runcol>h3 small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:500}
.job{border:1px solid var(--line);border-left:5px solid var(--out);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--panel);min-width:0}
.job.pick{border-left-color:var(--yard)} .job.swap{border-left-color:var(--brand)} .job.other{border-left-color:var(--off)}
.job.done{opacity:.62}
.job.carry{background:var(--late-bg)}
.job .who2{font-weight:600;overflow-wrap:anywhere}
.job .meta{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.job .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.empty{font-size:.88rem;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:14px;text-align:center}
.mscroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.wrap.full{max-width:none}
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(0,2fr)) repeat(2,minmax(0,1fr));min-width:2050px;background:var(--panel)}
.mgrid.big{min-width:2300px}
.dc{border-right:1px solid var(--line);border-bottom:2px solid var(--ink);min-height:118px;display:flex;flex-direction:column;min-width:0}
.mgrid.big .dc{min-height:340px}
.dc.past{background:var(--past-bg)}
.dc.outm{background:var(--bg)} .dc.outm>*{opacity:.5}
.dh{display:flex;justify-content:space-between;gap:6px;background:var(--head-bg);color:var(--cell-ink);border:0;border-bottom:1px solid var(--line);padding:3px 6px;font-weight:600;font-size:.76rem;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
.dh.today{background:var(--brand);color:var(--brand-ink)}
.dh .cnt b{font-variant-numeric:tabular-nums;padding:0 3px;border-radius:3px}
.dh .cnt .cd1{background:var(--cdel)} .dh .cnt .cc1{background:var(--ccol)}
.subs{display:grid;grid-template-columns:1fr 1fr;flex:1}
.sub{display:flex;flex-direction:column;min-width:0} .subs .sub+.sub{border-left:1px solid var(--line)}
.jr{display:grid;grid-template-columns:minmax(0,1fr) 30px 30px 30px 16px;align-items:stretch;border:0;border-bottom:1px solid var(--line);background:none;padding:0;font-size:.76rem;text-align:left;cursor:pointer;min-height:21px;color:var(--ink)}
.mgrid.big .jr{font-size:.85rem;min-height:26px;grid-template-columns:minmax(0,1fr) 36px 36px 36px 20px}
.jr:hover{background:var(--bg)}
.jr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 4px;align-self:center}
.jr .cd{font-size:.68rem;color:var(--muted);align-self:center;overflow:hidden;white-space:nowrap}
.jr .c{display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:.72rem;color:var(--cell-ink);overflow:hidden;white-space:nowrap}
.jr .c.del{background:var(--cdel)} .jr .c.col{background:var(--ccol)}
.jr .c.want-d{box-shadow:inset 0 0 0 2px var(--late)} .jr .c.want-c{box-shadow:inset 0 0 0 2px var(--yard);color:var(--yard)}
.jr .dv{font-size:.7rem;font-weight:700;color:var(--muted);align-self:center;text-align:center}
.jr[draggable=true]{cursor:grab}
.sub.over{background:var(--out-bg);outline:2px dashed var(--out);outline-offset:-2px}
.dh .add{border:0;background:var(--panel);color:var(--ink);border-radius:3px;padding:0 6px;margin-left:4px;cursor:pointer;font-weight:700}
.mtabs{display:flex;flex-wrap:wrap;gap:4px}
.mtabs button{border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.82rem;font-weight:600}
.mtabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.yr{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:600}
.popact{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.popact button{font:inherit;font-size:.8rem;padding:4px 10px;border-radius:5px;border:1px solid #c9d1d9;background:#fff;cursor:pointer}
.popact a.gm{font-size:.8rem;padding:4px 10px;border-radius:5px;border:1px solid #c9d1d9;background:#fff;color:#1d5fa8;text-decoration:none}
.popact button.go{background:#f0b400;border-color:#f0b400;font-weight:600}
.leaflet-popup-content table{font-size:.78rem}
.leaflet-popup-content td{padding:2px 6px 2px 0;border:0}
.jr.sla .nm{background:var(--sla-bg);color:var(--sla);font-weight:600}
.jr.late .nm{color:var(--late);font-weight:700}
.jr.plan .nm{font-style:italic}
.glegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.glegend i{display:inline-block;width:14px;height:12px;margin-right:5px;vertical-align:-1px;border-radius:2px}
#lmap{height:520px;border:1px solid var(--line);border-radius:6px;z-index:0}
.pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-family:var(--display);font-weight:700;font-size:16px;background:var(--pin-out);color:var(--pin-ink);border:2px solid var(--pin-ink);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin.late{background:var(--pin-late)}
.pin.addr{border-style:dashed}
.pin.area{border-style:dotted;opacity:.7}
.pin.yardpin{border-radius:4px;background:var(--pin-yard)}
.pin.book{background:var(--pin-ink);color:var(--pin-out);border:2px dashed var(--pin-out)}
.pin.dim{opacity:.25}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.two,.sched{grid-template-columns:1fr}.who{margin-left:0;width:100%}.money{grid-template-columns:1fr}#lmap{height:420px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><b>SKIP</b>GO</div>
    <span class="demo" id="demoTag" hidden>Demo with sample data</span>
    <div class="who" id="who"></div>
  </header>
  <main id="app" class="stack"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/leaflet.js"></script>
<script>
const CFG=window.SKIPGO_CONFIG||{};
const LIVE=!!(CFG.supabaseUrl&&CFG.supabaseKey&&window.supabase);
const sb=LIVE?supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey):null;
const DOMAIN=CFG.loginDomain||'skipgo-users.com';
const PREVIEW=!LIVE&&window.SKIPGO_PREVIEW?window.SKIPGO_PREVIEW:null;
const KEY=PREVIEW?'skipgo-preview-v1':'skipgo-local-v6', DAY=864e5;
const WASTE=['Mixed','Clean rubble','Garden','Wood','General','Recycle material'];
const HIRE=[[3,'3 days'],[7,'1 week'],[14,'2 weeks']];
const TYPE={drop:'Drop off',pick:'Pick up',swap:'Swap',other:'Other'};
const ROLE={pending:'Waiting for approval',driver:'Driver: schedule, drop off and pick up',office:'Office: full dashboard'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'});
const fmtT=t=>fmt(t)+' '+new Date(t).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
const R=n=>n==null?'—':'R '+Number(n).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const daysOut=j=>Math.max(0,Math.floor((Date.now()-j.droppedAt)/DAY));
const isLate=s=>s.status==='client'&&Date.now()>s.job.dueAt;
const metres=(a,b,c,d)=>{const r=Math.PI/180;return Math.hypot((d-b)*r*Math.cos((a+c)/2*r),(c-a)*r)*6371000};
// Dates on the schedule are plain YYYY-MM-DD strings in local (Cape Town) time.
const ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>ymd(Date.now());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dayName=s=>new Date(s+'T12:00:00').toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const dayShort=s=>new Date(s+'T12:00:00').toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'});

// Suburb centres, used when a skip or job has no exact pin.
const GEO={'Table View':[-33.823,18.49],'Milnerton':[-33.87,18.495],'Brackenfell':[-33.875,18.69],'Montague Gardens':[-33.86,18.52],'Durbanville':[-33.832,18.647],'Parklands':[-33.805,18.5],'Bellville':[-33.9,18.63],'Kenridge':[-33.85,18.635],'Blouberg':[-33.8,18.462],'Bloubergstrand':[-33.8,18.462],'Sea Point':[-33.915,18.39],'Goodwood':[-33.905,18.555],'Killarney Gardens':[-33.835,18.53],'Cape Town':[-33.925,18.424],'Camps Bay':[-33.951,18.378],'Claremont':[-33.981,18.465],'Constantia':[-34.02,18.42],'Maitland':[-33.922,18.49],'Kraaifontein':[-33.848,18.717],'Welgemoed':[-33.875,18.61],'Big Bay':[-33.79,18.458],'Century City':[-33.892,18.512],'Plattekloof':[-33.87,18.585],'Edgemead':[-33.875,18.545],'Bothasig':[-33.86,18.54],'Monte Vista':[-33.885,18.555],'Parow':[-33.9,18.59],'Stikland':[-33.895,18.665],'Sunningdale':[-33.79,18.49],'Melkbosstrand':[-33.725,18.44],'Vissershok':[-33.78,18.55],'Epping':[-33.93,18.54],'Paarden Eiland':[-33.91,18.47],'Atlantis':[-33.57,18.49],'Athlone':[-33.96,18.51],'Green Point':[-33.905,18.405],'Woodstock':[-33.927,18.445],'Pinehurst':[-33.84,18.66],'Airport Industria':[-33.96,18.58],'N1 City':[-33.89,18.56],'Woodbridge Island':[-33.88,18.485]};
const ll=k=>{const n=Object.keys(GEO).find(n=>n.toLowerCase()===String(k).trim().toLowerCase());return n?GEO[n]:null};

function blank(){return {skips:[],log:[],yards:[],yardGeo:{},users:[],inv:[],clients:[],cpriv:{},jobs:[],jprice:{},jobSeq:1,clientSeq:1,cfg:{rate:{2:850,3:1150},vat:true,nextInv:1,biz:'Your Skip Company (Pty) Ltd',run1:'Run 1',run2:'Run 2'}}}

/* ---------- Demo data (made up, lives only in this browser) ---------- */
function seed(){
  let r=7; const rnd=()=>(r=(r*16807)%2147483647)/2147483647;

  pick(a){

    if(a.swap){const r=skip(a.swap);if(!r||r.status!=='yard')throw new Error(`Skip ${a.swap} is not available for the swap.`)}

    if(a.swap){j.status='planned';return this._drop({no:a.swap,client:sj.client,area:sj.area,address:sj.address,waste:sj.waste,days:sj.days||3,lat:a.lat??sj.lat,lng:a.lng??sj.lng,pin:a.lat!=null?'gps':sj.pin,job:j.id},undefined,iv(sj.inv)?.method)}

  },
  addJob(a){
    if(!a.date)throw new Error('Choose a date.'); if(!a.client)throw new Error('Choose a client.');
    if((a.type==='pick'||a.type==='swap')&&!a.skip)throw new Error('Choose the skip to collect.');
    const cid=a.client_id||this._client(a.client,a.area,a.address);
    const j=this._newJob({driver:a.driver||'',date:a.date,run:a.run,type:a.type,client_id:cid,client:a.client,area:a.area,address:a.address,lat:a.lat??null,lng:a.lng??null,waste:a.waste,days:a.days,skip:a.skip??null,note:a.note||''});
    if(a.amount!=null||a.method)S.jprice[j.id]={amount:a.amount??null,method:a.method||null};
    return j.id;
  },
  moveJob(a){const j=job(a.id);if(!j||j.status!=='planned')throw new Error('Only a job that is not done yet can be moved.');if(!a.date)throw new Error('Choose a date.');
    if(a.date!==j.date){j.moved_from=j.moved_from||j.date;j.moves++}j.date=a.date;if(a.run)j.run=a.run;if(a.driver!==undefined)j.driver=a.driver;j.pos=S.jobSeq++},
  invoice(a){const j=job(a.job);if(!j||j.hist)throw new Error('That job cannot be invoiced.');if(j.invoice)throw new Error('That job already has an invoice.');const no=S.cfg.nextInv++;j.invoice=no;return no},
  cancelJob(a){const j=job(a.id);if(j&&j.status==='planned')j.status='cancelled'},
  finishJob(a){const j=job(a.id);if(!j||j.status!=='planned'||j.type!=='other')throw new Error('Record drop-offs and pick-ups with the Drop off / Pick up screen.');j.status='done';j.done_at=Date.now();j.by_name=me.name},
  saveClient(a){
    if(!a.name)throw new Error('Give the client a name.');
    let c=a.id?client(a.id):null; if(!c){c={id:S.clientSeq++};S.clients.push(c)}

    S.cpriv[c.id]={price:a.price??null,method:a.method||'EFT',office_notes:a.office_notes||''};return c.id},
  service(a){const s=skip(a.no);if(a.on){if(s.status!=='yard')throw new Error('Only a skip standing in a yard can be taken out of service.');s.status='service';s.yard=null;addLog({type:'service',skip:s.no})}else{s.status='yard';s.yard=S.yards[0];addLog({type:'back',skip:s.no,yard:s.yard})}},
  size(a){skip(a.no).size=a.size},
  addSkip(a){if(skip(a.no))throw new Error(`Skip ${a.no} already exists.`);S.skips.push({no:a.no,size:a.size,status:'yard',yard:a.yard,note:'',job:null});S.skips.sort((x,y)=>x.no-y.no);addLog({type:'add',skip:a.no,yard:a.yard})},
  addYard(a){if(!S.yards.includes(a.name))S.yards.push(a.name)},
  paid(a){iv(a.no).paid=a.paid?Date.now():null},
  cfg(a){const mx=Math.max(0,...S.jobs.map(j=>j.invoice||0));if(a.nextInv<=mx)throw new Error(`The next invoice number must be higher than ${mx}, the last invoice already filed.`);S.cfg={biz:a.biz,rate:S.cfg.rate,vat:a.vat,nextInv:a.nextInv,run1:a.run1||S.cfg.run1,run2:a.run2||S.cfg.run2}},
  role(){}
};
async function act(name,a){
  try{
    let res;
    if(LIVE){const [fn,args]=RPC[name](a);const {data,error}=await sb.rpc(fn,args);if(error)throw new Error(error.message);res=data;
      if(FULL.has(name))await refresh();else await refreshLight()}
    else{res=local[name](a);save()}
    return {ok:true,res};
  }catch(e){
    toast(e.message||'Something went wrong. Try again.');
    if(LIVE){try{await refreshLight()}catch(_){}}
    return {ok:false};
  }
}

async function findAddr(p){

  box.innerHTML='<span class="note">Searching…</span>';

const WD=['MON','TUE','WED','THU','FRI','SAT','SUN'];

    const nd=list.reduce((x,j)=>x+j.drop_skips.length,0), nc=list.reduce((x,j)=>x+j.pick_skips.length,0), np=list.filter(j=>j.status==='planned').length;

    <span><i style="background:var(--sla-bg)"></i>SLA client</span><span><i style="background:var(--past-bg);border:1px solid var(--line)"></i>Day done</span><span><i style="background:var(--late)"></i>Red name: not done on that day</span><span><b>T</b> Tapson · <b>M</b> Mike · <b>G</b> Gareth</span></div>
  <p class="note">Each line shows the client, area, skip delivered, skip collected and the driver (T = Tapson, M = Mike, G = Gareth). The day header shows planned jobs, then skips delivered and collected. Tap a job for details, tap a day to open it${office?', press + to add a job, and drag a planned job to another day or column to reschedule it':', and drag a planned job to another day to reschedule it'}.</p>
  </section>`;
}

function dayView(){
  const d=viewDay, isToday=d===today();
  const day=S.jobs.filter(j=>j.date===d&&j.status!=='cancelled');
  const carry=isToday?S.jobs.filter(j=>j.status==='planned'&&j.date<d):[];
  const order=(a,b)=>(a.status==='planned'?0:1)-(b.status==='planned'?0:1)||(isSla(b)-isSla(a))||a.pos-b.pos||a.id-b.id;
  day.push(...histJobs(d));
  const names=[...drivers()]; if([...day,...carry].some(j=>!driverOf(j)||!names.includes(driverOf(j))))names.push('');
  const col=n=>{
    const f=j=>n?driverOf(j)===n:!names.slice(0,-1).includes(driverOf(j));
    const c=carry.filter(f).sort(order), l=day.filter(f).sort(order);
    const left=c.length+l.filter(j=>j.status==='planned').length;
    return `<section class="runcol"><h3>${esc(n||'No driver yet')} <small>${left} to do · ${l.filter(j=>j.status==='done').length} done</small></h3>
      ${c.map(j=>jobCard(j,true)).join('')}${l.map(j=>jobCard(j,false)).join('')}

  const office=me.role==='office';
  const end=new Date(addDays(d,1)+'T00:00:00').getTime();
  const covered=new Set(S.jobs.filter(j=>j.status==='planned'&&j.skip).map(j=>j.skip));
  const due=d>=today()?outNow().filter(s=>s.job.dueAt<end&&!covered.has(s.no)).sort((a,b)=>a.job.dueAt-b.job.dueAt):[];
  return `<section class="panel stack">${schedBar()}
  ${isToday&&carry.length?`<p class="note">Jobs not done on an earlier day stay on today's list, shaded red, until they are recorded or moved.</p>`:''}
  <div class="sched" style="grid-template-columns:repeat(${names.length},minmax(0,1fr))">${names.map(col).join('')}</div>
  </section>
  ${office&&due.length?`<section class="panel stack"><h3>Due for pick-up by ${dayShort(d)}, not on the schedule</h3>

    ${due.map(s=>`<tr><td class="num">${s.no}</td><td>${esc(s.job.client)}${clientOf(s.job)?.sla?' <span class="pill sla">SLA</span>':''}</td><td>${esc(s.job.area)}</td><td>${fmt(s.job.dueAt)}${isLate(s)?' <span class="pill late">Overdue</span>':''}</td>

`;
}

function binClass(s){return s.status==='service'?'off':s.status==='yard'?'yard':isLate(s)?'late':'out'}
function binLabel(s){return s.status==='service'?'Service':s.status==='yard'?(String(s.yard||'Yard').split(' ')[0]):isLate(s)?'Overdue':daysOut(s.job)+'d out'}
const areaKey=j=>j.area||'No area';
function areaGroups(){const g={};outNow().forEach(s=>{const k=areaKey(s.job);(g[k]=g[k]||[]).push(s)});if(areaF&&!g[areaF])areaF='';return g}
function areaChips(g){return `<div class="chips" role="group" aria-label="Show one area"><button class="chip" data-area="" aria-pressed="${!areaF}">All areas</button>${Object.keys(g).sort().map(k=>`<button class="chip" data-area="${esc(k)}" aria-pressed="${areaF===k}">${esc(k)} · ${g[k].length}</button>`).join('')}</div>`}
function areaTable(g){return areaF?`<h3>Skips in ${esc(areaF)}</h3><div class="scroll"><table><thead><tr><th>Skip</th><th>Address</th><th>Client</th><th>Days out</th><th>Status</th></tr></thead><tbody>${g[areaF].map(s=>`<tr><td class="num">${s.no}</td><td>${esc(s.job.address)}</td><td>${esc(s.job.client)}</td><td>${daysOut(s.job)}</td><td><span class="pill ${isLate(s)?'late':'out'}">${isLate(s)?'Overdue':'On hire'}</span></td></tr>`).join('')}</tbody></table></div>`:''}
function boardView(){const g=areaGroups();return `<section class="panel stack">
  <div class="row spread"><h2>Where every skip is right now</h2>
  <div class="legend"><span><i class="dot" style="background:var(--yard)"></i>In a yard</span><span><i class="dot" style="background:var(--out)"></i>At a client</span><span><i class="dot" style="background:var(--late)"></i>Overdue</span><span><i class="dot" style="background:var(--off)"></i>Out of service</span></div></div>
  ${areaChips(g)}
  <div class="board">${S.skips.map(s=>`<button class="bin ${binClass(s)}${areaF&&(!s.job||areaKey(s.job)!==areaF)?' dim':''}" data-skip="${s.no}" title="${esc(s.job?s.job.client+', '+s.job.area:s.yard||'Out of service')}"><span class="no">${s.no}</span>${s.job?`<span class="ar">${esc(s.job.area||s.job.client)}</span>`:''}<span class="st">${esc(binLabel(s))}</span></button>`).join('')||'<p class="note">No skips yet. Add them under Settings.</p>'}</div>
  ${areaTable(g)}
  <p class="note">Tap an area to see only its skips. Tap a skip for its client, address and history.</p>
</section>`}
function skipLL(s,i){const j=s.job;if(j.lat!=null&&j.lng!=null)return [j.lat,j.lng,j.pin==='gps'?'gps':'addr'];
  const c=ll(j.area);if(!c)return null;const a=i*2.4,r=.004*(1+Math.floor(i/6));return [c[0]+r*Math.sin(a),c[1]+r*1.2*Math.cos(a),'area']}
function skipHistory(no){
  const own=j=>j.status==='done'&&(j.drop_skips.includes(no)||j.pick_skips.includes(no));
  let l=S.jobs.filter(own);
  if(PREVIEW&&l.length<8){const old=[];previewDays().forEach(v=>v.forEach(j=>{if(own(j))old.push(j)}));old.forEach(j=>HIST.set(j.id,j));l=l.concat(old)}
  return l;
}
// A link that opens Google Maps at the skip, for directions on the driver's phone.
function gmaps(j,p){const q=j.lat!=null?`${j.lat},${j.lng}`:p&&p[2]!=='area'?`${p[0]},${p[1]}`:[j.address,j.area,'Cape Town'].filter(Boolean).join(', ');return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}

}
function mapView(){
  const g=areaGroups(), cnt={}, missing=[];
  outNow().forEach(s=>{const i=cnt[s.job.area]=(cnt[s.job.area]||0);cnt[s.job.area]++;if(!skipLL(s,i))missing.push(s.no)});

</section>`}
function drawMap(){
  const el=$('#lmap'); if(!el||!window.L)return;
  lmap=L.map(el,{scrollWheelZoom:false});
  // On the website: OpenStreetMap. When the page is opened straight from a file (the private preview), OpenStreetMap
  // refuses the tiles, so CARTO's copy of the same map is used instead.
  if(location.protocol==='file:')L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{subdomains:'abcd',maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(lmap);
  else L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(lmap);
  const icon=(cls,txt)=>L.divIcon({className:'',html:`<span class="pin ${cls}">${txt}</span>`,iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-14]});
  const bounds=[], cnt={};
  outNow().forEach(s=>{const j=s.job,i=cnt[j.area]=(cnt[j.area]||0);cnt[j.area]++;const p=skipLL(s,i);if(!p)return;
    const dim=areaF&&areaKey(j)!==areaF;
    L.marker([p[0],p[1]],{icon:icon(`${p[2]}${isLate(s)?' late':''}${dim?' dim':''}`,s.no),zIndexOffset:dim?0:500}).addTo(lmap)
      .bindPopup(()=>`<strong>Skip ${s.no}</strong> · ${esc(j.client)}<br>${esc([j.address,j.area].filter(Boolean).join(', '))}<br>${daysOut(j)} days out${isLate(s)?', overdue':''}<br>${p[2]==='gps'?'Location from the driver’s phone':p[2]==='addr'?'Location from the address':'Suburb only, no exact pin'}${j.flag?`<br><strong>Check:</strong> dropped ${j.flag} m from the booked address`:''}${recentHtml(s.no)}<div class="popact"><button class="go" data-picknow="${s.no}">Pick up</button><button data-swapnow="${s.no}">Swap</button><button data-skip="${s.no}">Details</button><a class="gm" href="${gmaps(j,p)}" target="_blank" rel="noopener">Directions</a></div>`);
    if(!dim)bounds.push([p[0],p[1]])});
  S.yards.forEach(y=>{const c=S.yardGeo[y]||ll(y);if(!c)return;
    L.marker(c,{icon:icon('yardpin'+(areaF?' dim':''),avail().filter(s=>s.yard===y).length)}).addTo(lmap).bindPopup(()=>{const a=avail().filter(s=>s.yard===y);return `<strong>${esc(y)} yard</strong><br>${a.length?'Tap a skip to drop it off at a client:':'No skips available'}<div class="popact">${a.map(s=>`<button data-dropnow="${s.no}">${s.no}</button>`).join('')}</div>`});
    if(!areaF)bounds.push(c)});
  const soon=addDays(today(),7);
  S.jobs.filter(j=>j.status==='planned'&&j.type==='drop'&&j.date<=soon&&j.lat!=null).forEach(j=>{
    L.marker([j.lat,j.lng],{icon:icon('book'+(areaF&&j.area!==areaF?' dim':''),'+')}).addTo(lmap).bindPopup(`<strong>Planned delivery, ${dayShort(j.date)}</strong> · ${esc(j.client)}<br>${esc([j.address,j.area].filter(Boolean).join(', '))}`);
    if(!areaF||j.area===areaF)bounds.push([j.lat,j.lng])});
  if(bounds.length)lmap.fitBounds(bounds,{padding:[40,40],maxZoom:15});else lmap.setView([-33.85,18.55],11);
}

let msApp=null;
async function msToken(){
  if(!CFG.msClientId)throw new Error('OneDrive is not connected yet. Follow step 7 in the setup guide.');
  await loadScript('vendor/msal-browser.min.js');
  if(!msApp)msApp=new window.msal.PublicClientApplication({auth:{clientId:CFG.msClientId,authority:'https://login.microsoftonline.com/'+(CFG.msTenant||'common'),redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
  const req={scopes:['Files.ReadWrite']}, acc=msApp.getAllAccounts()[0];
  if(acc){try{return (await msApp.acquireTokenSilent({...req,account:acc})).accessToken}catch(e){}}
  return (await msApp.loginPopup(req)).accessToken;
}
const odPath=(...parts)=>'/me/drive/root:/'+[CFG.oneDriveFolder||'SkipGo',...parts].map(encodeURIComponent).join('/')+':/content';
async function graph(path,opt={}){
  const tok=await msToken();
  const r=await fetch('https://graph.microsoft.com/v1.0'+path,{...opt,headers:{Authorization:'Bearer '+tok,...(opt.headers||{})}});
  if(!r.ok){if(r.status===404)throw new Error('Not found in OneDrive: '+decodeURIComponent(path.split('root:/')[1]||'').replace(':/content',''));throw new Error('OneDrive said no ('+r.status+'). Try again, or sign in to Microsoft again.')}
  return r;
}
async function priceFor(clientName,size){
  if(!LIVE){const c=SAMPLE_PRICES.contract[clientName];return {amount:c??SAMPLE_PRICES.standard[size],from:c!=null?'SLA contract price':'standard price',sample:true}}
  await loadXlsx();
  const buf=await (await graph(odPath('Prices.xlsx'))).arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'}), rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  const val=r=>+(String(r['Price incl. VAT (R)']??r.Price??'').replace(/[^\d.]/g,''))||null, sz=r=>+(r['Skip size (m3)']??r.Size??0);
  const name=String(clientName).trim().toLowerCase();
  const mine=rows.find(r=>String(r.Client||'').trim().toLowerCase()===name&&(!sz(r)||sz(r)===size)&&val(r));
  if(mine)return {amount:val(mine),from:'SLA or client price in the OneDrive price list'};
  const std=rows.find(r=>String(r.Client||'').trim().toLowerCase()==='standard'&&sz(r)===size&&val(r));
  return std?{amount:val(std),from:'standard price in the OneDrive price list'}:{amount:null,from:'no price found in the OneDrive price list'};
}
async function makePdf(j,no,amount,method){
  await loadScript('vendor/jspdf.umd.min.js');
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}), ex=amount/1.15, vat=S.cfg.vat, size=skip(j.drop_skips[0])?.size||2;
  const money=n=>'R '+n.toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text(S.cfg.biz||'Invoice',20,25);
  doc.setFontSize(13);doc.text((vat?'TAX INVOICE ':'INVOICE ')+no,190,25,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(11);
  const c=clientOf(j), lines=[['Date',dayName(j.date)],['Bill to',j.client],['Contact',c?[c.contact,c.phone,c.email].filter(Boolean).join(', '):''],['Delivered to',[j.address,j.area].filter(Boolean).join(', ')]];
  let y=40;lines.forEach(([k,v])=>{if(!v)return;doc.setTextColor(110);doc.text(k,20,y);doc.setTextColor(0);doc.text(String(v),55,y,{maxWidth:135});y+=8});
  y+=6;doc.line(20,y,190,y);y+=8;

  if(vat){doc.text('VAT 15%',20,y);doc.text(money(amount-ex),190,y,{align:'right'});y+=10}
  doc.line(20,y-4,190,y-4);doc.setFont('helvetica','bold');doc.text('Total due',20,y+2);doc.text(money(amount),190,y+2,{align:'right'});
  doc.setFont('helvetica','normal');doc.text('Payment: '+method,20,y+14);
  return doc.output('blob');
}

/* ---------- Drag a planned job to another day or column ---------- */
document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('[data-drag]');if(!r)return;e.dataTransfer.setData('text/plain',r.dataset.drag);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();document.querySelectorAll('.sub.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',async e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.remove('over');
  const id=+e.dataTransfer.getData('text/plain'), [date,run]=z.dataset.drop.split('|'), j=job(id); if(!j||j.status!=='planned')return;
  if(j.date===date&&j.run===+run)return;
  if((await act('moveJob',{id,date,run:+run})).ok){render();toast(`${j.client} moved to ${dayShort(date)}`)}});
// Demo: changes made in another tab show up here straight away.
window.addEventListener('storage',e=>{if(LIVE||e.key!==KEY)return;const v=load();if(!v)return;const u=me&&me.u;S=v;me=u?S.users.find(x=>x.u===u)||me:me;if(!$('#dlg').open)render()});

/* ---------- Start ---------- */
(async()=>{
  if(LIVE){
    try{const {data}=await sb.auth.getSession();await loadMe(data.session)}catch(e){toast('Could not reach the database: '+e.message)}
    booted=true;
    // Live updates: redraw as soon as anyone records a move, with a slow check as a back-up.
    setInterval(async()=>{
      if(!me||me.role==='pending'||document.hidden||$('#dlg').open)return;
      if(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
      const before=JSON.stringify([S.skips,S.jobs,S.log]);
      try{await refreshLight()}catch(e){return}
      if(JSON.stringify([S.skips,S.jobs,S.log])!==before)render();
    },60000);
  }
  render(true);
})();
</script>
</body>
